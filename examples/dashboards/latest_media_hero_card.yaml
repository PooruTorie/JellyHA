# ==============================================================================
# JellyHA Dashboard Examples: Latest Media Hero Banner Cards
# ==============================================================================
# Cinematic hero banner cards for displaying recently added movies or TV episodes.
# Automatically scales poster art to dynamically fit the visual height of the card!
#
# Requirements:
#   - JellyHA v1.3.0+ (provides sensor.jellyha_latest_movie and sensor.jellyha_latest_episode)
#   - card-mod (available via HACS) for backdrop blur and glassmorphism styling
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Latest Movie Hero Banner (Cinematic Backdrop + Dynamically Scaled Poster)
# ------------------------------------------------------------------------------
type: markdown
content: >
  <div class="hero-container"><div class="poster-col"><img src="{{ state_attr('sensor.jellyha_latest_movie', 'poster_url') }}" class="poster-img" alt="Poster"></div><div class="info-col"><h1 class="media-title">{{ state_attr('sensor.jellyha_latest_movie', 'title') }}</h1><div class="badge-row"><span class="badge-primary">{{ state_attr('sensor.jellyha_latest_movie', 'resolution') }}</span><span class="badge-text">{{ state_attr('sensor.jellyha_latest_movie', 'year') }} •</span><span class="badge-rating">★ {{ state_attr('sensor.jellyha_latest_movie', 'rating') }}</span></div><p class="overview-text">{{ state_attr('sensor.jellyha_latest_movie', 'overview') }}</p></div></div>
card_mod:
  style:
    .: |
      :host {
        --shadow-bottom: rgba(0, 0, 0, 0.92);
        --shadow-middle: rgba(0, 0, 0, 0.50);
        --shadow-top: rgba(0, 0, 0, 0.00);
        --backdrop-blur: 4px;
        display: block !important;
        height: 100% !important;
      }
      ha-card {
        position: relative;
        height: 100% !important;
        overflow: hidden !important;
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
        border-radius: 16px !important;
        padding: 14px 18px !important;
        box-sizing: border-box !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: center !important;
        --divider-color: transparent !important;
      }
      ha-markdown {
        position: relative !important;
        z-index: 2 !important;
        height: 100% !important;
        width: 100% !important;
        display: flex !important;
        align-items: center !important;
        overflow: hidden !important;
        padding: 0 !important;
      }
      ha-card::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: 
          linear-gradient(to top, var(--shadow-bottom) 0%, var(--shadow-middle) 50%, var(--shadow-top) 100%), 
          url('{{ state_attr("sensor.jellyha_latest_movie", "backdrop_url") or state_attr("sensor.jellyha_latest_movie", "poster_url") }}');
        background-size: cover;
        background-position: center;
        filter: blur(var(--backdrop-blur));
        transform: scale(1.05);
        z-index: 1 !important;
        pointer-events: none !important;
      }
    ha-markdown $: |
      ha-markdown-element {
        width: 100% !important;
        height: 100% !important;
        display: flex !important;
        align-items: center !important;
      }
      .hero-container {
        width: 100% !important;
        height: 100% !important;
        display: flex !important;
        flex-direction: row !important;
        align-items: center !important;
        gap: 16px !important;
        box-sizing: border-box !important;
      }
      .poster-col {
        height: 100% !important;
        max-height: 100% !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        flex-shrink: 0 !important;
      }
      .poster-img {
        height: 100% !important;
        max-height: 100% !important;
        width: auto !important;
        aspect-ratio: 2 / 3 !important;
        object-fit: cover !important;
        border-radius: 12px !important;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.85) !important;
        border: 1.5px solid rgba(255, 255, 255, 0.35) !important;
        display: block !important;
      }
      .info-col {
        flex: 1 1 auto !important;
        min-width: 0 !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: center !important;
      }
      .media-title {
        margin: 0 0 6px 0 !important;
        font-size: clamp(1rem, 2.2vw, 1.6rem) !important;
        font-weight: 800 !important;
        line-height: 1.15 !important;
        color: #ffffff !important;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95) !important;
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
      }
      .badge-row {
        margin: 0 0 8px 0 !important;
        display: flex !important;
        align-items: center !important;
        flex-wrap: wrap !important;
        gap: 6px !important;
      }
      .badge-primary {
        background: var(--primary-color, #03a9f4) !important;
        color: white !important;
        font-size: 0.72rem !important;
        font-weight: 700 !important;
        padding: 2px 7px !important;
        border-radius: 10px !important;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5) !important;
        display: inline-block !important;
      }
      .badge-text {
        color: #ffffff !important;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9) !important;
        font-size: 0.8rem !important;
      }
      .badge-rating {
        color: #f5a623 !important;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9) !important;
        font-size: 0.8rem !important;
        font-weight: 700 !important;
      }
      .overview-text {
        margin: 0 !important;
        line-height: 1.35 !important;
        font-size: clamp(0.78rem, 1.1vw, 0.88rem) !important;
        color: rgba(255, 255, 255, 0.9) !important;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95) !important;
        display: -webkit-box !important;
        -webkit-line-clamp: 3 !important;
        -webkit-box-orient: vertical !important;
        overflow: hidden !important;
      }

